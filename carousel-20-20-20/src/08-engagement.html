<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--blue); }
  .kick { top: 190px; right: var(--margin); color: var(--blue); font-size: 42px; font-weight: 600; }
  .q { top: 256px; right: var(--margin); color: var(--white); font-size: 96px; font-weight: 700; line-height: 1.28; }
  .cta { top: 950px; right: var(--margin); color: var(--navy); font-size: 72px; font-weight: 700; line-height: 1.3; }
  .cta2 { top: 1056px; right: var(--margin); color: var(--navy); font-size: 44px; font-weight: 500; line-height: 1.5; }
  .name { bottom: 50px; right: var(--margin); color: var(--navy); font-size: 40px; font-weight: 700; display: flex; align-items: center; gap: 16px; z-index: 5; }
  .name .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--yellow); }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- an upper eyelid closing over the question: the rest moment (echoes the cover eye) -->
    <path style="fill:var(--navy)" d="M0 0 H1080 V700 Q540 980 0 700 Z"/>
    <g style="stroke:var(--navy)" stroke-width="13" stroke-linecap="round">
      <line x1="162" y1="771" x2="143" y2="823"/>
      <line x1="324" y1="818" x2="313" y2="872"/>
      <line x1="486" y1="839" x2="483" y2="894"/>
      <line x1="594" y1="839" x2="597" y2="894"/>
      <line x1="756" y1="818" x2="767" y2="872"/>
      <line x1="918" y1="771" x2="937" y2="823"/>
    </g>
  </svg>
  <div class="abs kick">سؤال صريح</div>
  <div class="abs q">آخر مرة شِلت<br>عينك من الشاشة،<br>چانت شوكت؟</div>
  <div class="abs cta">جاوب <span class="brush">بالتعليقات</span></div>
  <div class="abs cta2">واحفظ البوست، ودزّه لصديقك<br>اللي يدرس من الموبايل.</div>
  <div class="abs name"><span class="dot"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--blue);">08 / 08</div>
</div><script src="shaping.js"></script></body></html>
