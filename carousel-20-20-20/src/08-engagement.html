<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--blue); }
  .qmark { top: 60px; left: 120px; color: var(--blue); font-size: 340px; font-weight: 700; line-height: 1; opacity: .9; }
  .kick { top: 220px; right: var(--margin); color: var(--blue); font-size: 40px; font-weight: 600; }
  .q { top: 290px; right: var(--margin); width: 780px; color: var(--white); font-size: 92px; font-weight: 700; line-height: 1.3; }
  .cta { top: 1010px; right: var(--margin); color: var(--navy); font-size: 64px; font-weight: 700; line-height: 1.3; }
  .cta2 { top: 1110px; right: var(--margin); width: 820px; color: var(--navy); font-size: 34px; font-weight: 500; line-height: 1.6; }
  .name { bottom: 50px; right: var(--margin); color: var(--navy); font-size: 40px; font-weight: 700; display: flex; align-items: center; gap: 16px; z-index: 5; }
  .name .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--yellow); }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- the cover's iris, now rising from the top: same planes, mirrored -->
    <circle style="fill:var(--navy)" cx="540" cy="370" r="560"/>
  </svg>
  <div class="abs qmark">؟</div>
  <div class="abs kick">سؤال صريح</div>
  <div class="abs q">آخر مرة شِلت<br>عينك من الشاشة،<br>چانت شوكت؟</div>
  <div class="abs cta">جاوب <span class="brush">بالتعليقات</span></div>
  <div class="abs cta2">واحفظ البوست، ودزّه لصديقك اللي يدرس من الموبايل.</div>
  <div class="abs name"><span class="dot"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--white);">08 / 08</div>
</div><script src="shaping.js"></script></body></html>
