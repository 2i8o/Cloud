<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--blue); }
  .kick { top: 180px; right: var(--margin); color: var(--blue); font-size: 40px; font-weight: 500; }
  .q { top: 244px; right: var(--margin); color: var(--white); font-size: 96px; font-weight: 700; line-height: 1.28; }
  .cta { top: 960px; right: var(--margin); color: var(--navy); font-size: 64px; font-weight: 700; line-height: 1.3; }
  .cta2 { top: 1058px; right: var(--margin); color: var(--navy); font-size: 44px; font-weight: 500; line-height: 1.5; }
  .name { bottom: 54px; right: var(--margin); color: var(--navy); font-size: 38px; font-weight: 700; display: flex; align-items: center; gap: 16px; z-index: 5; }
  .name .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--yellow); }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- an upper eyelid closing over the question: the rest moment (echoes the cover eye) -->
    <path style="fill:var(--navy)" d="M0 0 H1080 V690 C860 860 220 860 0 690 Z"/>
    <g style="stroke:var(--navy)" stroke-width="9" stroke-linecap="round">
      <line x1="196" y1="775" x2="176" y2="822"/>
      <line x1="368" y1="806" x2="360" y2="858"/>
      <line x1="540" y1="815" x2="540" y2="868"/>
      <line x1="712" y1="806" x2="720" y2="858"/>
      <line x1="884" y1="775" x2="904" y2="822"/>
    </g>
  </svg>
  <div class="abs kick">سؤال صريح</div>
  <div class="abs q">آخر مرة شِلت<br>عينك من الشاشة،<br>چانت شوكت؟</div>
  <div class="abs cta">جاوب <span class="brush">بالتعليقات</span></div>
  <div class="abs cta2">واحفظ البوست، ودزّه لصديقك<br>اللي يدرس من الموبايل.</div>
  <div class="abs name"><span class="dot"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--blue);">08 / 08</div>
</div><script src="shaping.js"></script></body></html>
