<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--navy); }
  .was { top: 120px; right: var(--margin); color: var(--blue); font-size: 64px; font-weight: 600; }
  .was .strike { position: relative; }
  .was .strike::after { content: ""; position: absolute; left: -6px; right: -6px; top: 63%; height: 7px; border-radius: 4px; background: var(--white); transform: rotate(-2deg); }
  .now { top: 200px; right: var(--margin); color: var(--navy); font-size: 124px; font-weight: 700; line-height: 1.15; }
  .now .w { color: var(--white); }
  .why { top: 470px; right: var(--margin); width: 560px; color: var(--white); font-size: 38px; font-weight: 500; line-height: 1.65; }
  .tag { top: 770px; right: var(--margin); color: var(--blue); font-size: 34px; font-weight: 600; }
  .sym { color: var(--white); font-size: 40px; font-weight: 600; }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- light spill from the screen: concentric solid rings -->
    <g transform="translate(250 1000)">
      <circle style="stroke:var(--blue)" r="560" fill="none" stroke-opacity=".10" stroke-width="2"/>
      <circle style="stroke:var(--blue)" r="470" fill="none" stroke-opacity=".16" stroke-width="2"/>
      <circle style="fill:var(--blue)" r="380" fill-opacity=".10"/>
    </g>
    <!-- phone: real object, tilted, cropped by the left edge -->
    <g transform="translate(250 1010) rotate(-14)">
      <rect style="fill:var(--navy);stroke:var(--blue)" x="-200" y="-380" width="400" height="800" rx="58" stroke-width="6"/>
      <rect style="fill:var(--white)" x="-180" y="-360" width="360" height="760" rx="42"/>
      <rect style="fill:var(--navy)" x="-50" y="-344" width="100" height="26" rx="13"/>
      <text style="fill:var(--navy)" x="0" y="-170" text-anchor="middle" font-family="Plex Ar" font-weight="700" font-size="128" direction="ltr">2:47</text>
      <text style="fill:var(--navy)" x="0" y="-110" text-anchor="middle" font-family="Plex Ar" font-weight="600" font-size="30">بعد منتصف الليل</text>
      <!-- notification rows -->
      <g style="fill:var(--blue)">
        <circle cx="128" cy="-20" r="26"/>
        <rect x="-150" y="-36" width="240" height="14" rx="7" fill-opacity=".9"/>
        <rect x="-150" y="-8" width="170" height="12" rx="6" fill-opacity=".45"/>
        <circle cx="128" cy="80" r="26"/>
        <rect x="-150" y="64" width="210" height="14" rx="7" fill-opacity=".9"/>
        <rect x="-150" y="92" width="130" height="12" rx="6" fill-opacity=".45"/>
      </g>
    </g>
  </svg>
  <div class="abs was"><span class="strike">بس دقيقة…</span></div>
  <div class="abs now"><span class="brush">صارت</span> <span class="w">ساعتين</span></div>
  <div class="abs why">لمّا تبحلق بشاشة قريبة مدة طويلة، عيونك تشتغل أكثر: تركيز قريب بلا راحة، ولمعة، وحروف أقل حدّة من الورق.</div>
  <div class="abs tag">والنتيجة؟ اللي نسمّيه إجهاد العين الرقمي:</div>
  <div class="abs sym" style="top: 830px; right: 120px;">إجهاد وجفاف بالعين</div>
  <div class="abs sym" style="top: 910px; right: 200px;">صداع</div>
  <div class="abs sym" style="top: 990px; right: 150px;">تشوّش بالرؤية</div>
  <div class="abs sym" style="top: 1070px; right: 88px;">ألم بالرگبة والكتف</div>
  <svg class="layer" viewBox="0 0 1080 1350" style="pointer-events:none">
    <path style="stroke:var(--blue)" d="M1010 840 C1050 960 1040 1060 990 1130" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>
  </svg>
  <div class="sig" style="right: var(--margin); color: var(--white);"><span class="dot" style="background:var(--yellow)"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--blue);">02 / 08</div>
</div><script src="shaping.js"></script></body></html>
