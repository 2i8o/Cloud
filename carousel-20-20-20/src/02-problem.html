<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--blue); }
  .was { top: 110px; right: var(--margin); color: var(--navy); font-size: 64px; font-weight: 600; }
  .was .strike { position: relative; }
  .was .strike::after { content: ""; position: absolute; left: -6px; right: -6px; top: 52%; height: 7px; border-radius: 4px; background: var(--white); transform: rotate(-2deg); }
  .now { top: 190px; right: var(--margin); color: var(--navy); font-size: 128px; font-weight: 700; line-height: 1.15; }
  .now .w { color: var(--white); }
  .why { top: 400px; right: var(--margin); color: var(--navy); font-size: 44px; font-weight: 500; line-height: 1.55; }
  .tag { top: 836px; right: var(--margin); color: var(--blue); font-size: 46px; font-weight: 700; }
  .sym { color: var(--white); font-size: 46px; font-weight: 600; line-height: 1.3; }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- night plane: the hours that slipped away -->
    <path style="fill:var(--navy)" d="M0 660 L1080 840 L1080 1350 L0 1350 Z"/>
    <!-- phone: real object, tilted, cropped by the left edge -->
    <g transform="translate(240 1060) rotate(-14)">
      <rect style="fill:var(--navy);stroke:var(--blue)" x="-200" y="-380" width="400" height="800" rx="58" stroke-width="6"/>
      <rect style="fill:var(--white)" x="-180" y="-360" width="360" height="760" rx="42"/>
      <rect style="fill:var(--navy)" x="-50" y="-344" width="100" height="26" rx="13"/>
      <text style="fill:var(--navy)" x="0" y="-170" text-anchor="middle" font-family="Plex Ar" font-weight="700" font-size="128" direction="ltr">2:47</text>
      <text style="fill:var(--navy)" x="0" y="-110" text-anchor="middle" font-family="Plex Ar" font-weight="600" font-size="32">بعد منتصف الليل</text>
      <g style="fill:var(--blue)">
        <circle cx="128" cy="-20" r="26"/>
        <rect x="-150" y="-36" width="240" height="14" rx="7"/>
        <rect x="-150" y="-8" width="170" height="12" rx="6"/>
        <circle cx="128" cy="80" r="26"/>
        <rect x="-150" y="64" width="210" height="14" rx="7"/>
        <rect x="-150" y="92" width="130" height="12" rx="6"/>
      </g>
    </g>
  </svg>
  <div class="abs was"><span class="strike">بس دقيقة…</span></div>
  <div class="abs now"><span class="brush">صارت</span> <span class="w">ساعتين</span></div>
  <div class="abs why">شاشة قريبة لساعات، يعني تركيز قريب بلا راحة.</div>
  <div class="abs tag">والنتيجة: إجهاد العين الرقمي</div>
  <div class="abs sym" style="top: 916px; right: 88px;">إجهاد وجفاف بالعين</div>
  <div class="abs sym" style="top: 990px; right: 150px;">صداع</div>
  <div class="abs sym" style="top: 1064px; right: 118px;">تشوّش بالرؤية</div>
  <div class="abs sym" style="top: 1138px; right: 88px;">ألم بالرگبة والكتف</div>
  <div class="sig" style="right: var(--margin); color: var(--white);"><span class="dot" style="background:var(--yellow)"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--navy);">02 / 08</div>
</div><script src="shaping.js"></script></body></html>
