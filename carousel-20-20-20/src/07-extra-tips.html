<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--blue); }
  .kick { top: 108px; right: var(--margin); color: var(--navy); font-size: 40px; font-weight: 600; }
  .head { top: 164px; right: var(--margin); color: var(--navy); font-size: 100px; font-weight: 700; line-height: 1.2; }
  .tip .t { display: block; color: var(--navy); font-size: 58px; font-weight: 700; line-height: 1.25; }
  .tip .d { display: block; color: var(--navy); font-size: 42px; font-weight: 500; line-height: 1.45; }
  .tip.last .t { color: var(--navy); }
  .rule { position: absolute; height: 6px; width: 90px; border-radius: 3px; background: var(--white); }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- a closed eye: the blink / rest that the tips protect (echoes the cover eye) -->
    <g transform="translate(180 440)" style="stroke:var(--white)" fill="none" stroke-linecap="round">
      <path d="M-160 -20 Q0 110 160 -20" stroke-width="16"/>
      <line x1="-108" y1="30" x2="-136" y2="78" stroke-width="12"/>
      <line x1="-40" y1="52" x2="-50" y2="108" stroke-width="12"/>
      <line x1="40" y1="52" x2="50" y2="108" stroke-width="12"/>
      <line x1="108" y1="30" x2="136" y2="78" stroke-width="12"/>
    </g>
  </svg>
  <div class="abs kick">مو بس <span class="num">20-20-20</span></div>
  <div class="abs head">وحتى تكمل الراحة</div>

  <div class="abs tip" style="top: 380px; right: var(--margin);"><span class="t">لا تنسى ترمش</span><span class="d">الرمش يرطّب العين ويقلّل الجفاف.</span></div>
  <div class="rule" style="top: 552px; right: var(--margin);"></div>
  <div class="abs tip" style="top: 586px; right: 190px;"><span class="t">إضاءة الشاشة</span><span class="d">ابعد اللمعة والانعكاس عنها.</span></div>
  <div class="rule" style="top: 758px; right: 190px;"></div>
  <div class="abs tip" style="top: 792px; right: var(--margin);"><span class="t">المسافة</span><span class="d">لا تلزّگ الموبايل بوجهك.</span></div>
  <div class="rule" style="top: 964px; right: var(--margin);"></div>
  <div class="abs tip last" style="top: 998px; right: 190px;"><span class="t"><span class="brush">الأعراض مستمرة؟</span></span><span class="d">راجع أخصائي بصريات وافحص نظرك.</span></div>

  <div class="sig" style="right: var(--margin); color: var(--navy);"><span class="dot" style="background:var(--yellow)"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--navy);">07 / 08</div>
</div><script src="shaping.js"></script></body></html>
