<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--navy); }
  .step { top: 108px; right: var(--margin); color: var(--blue); font-size: 40px; font-weight: 600; }
  .head { top: 178px; right: var(--margin); color: var(--white); font-size: 96px; font-weight: 700; line-height: 1.2; text-align: right; }
  .center { left: 270px; width: 400px; top: 570px; text-align: center; }
  .center .n { color: var(--white); font-size: 230px; font-weight: 700; line-height: 1; letter-spacing: -6px; }
  .center .u { color: var(--blue); font-size: 56px; font-weight: 600; display: block; margin-top: -6px; }
  .note { top: 1140px; right: var(--margin); width: 904px; color: var(--white); font-size: 44px; font-weight: 500; line-height: 1.6; }
  .note b { color: var(--blue); font-weight: 700; }
  .least { display: inline-block; margin-top: 8px; color: var(--navy); font-size: 42px; font-weight: 700; line-height: 1.3; }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- 20 ticks = 20 seconds; white = elapsed, yellow = now -->
    <g>
      <line style="stroke:var(--white)" x1="470.0" y1="430.0" x2="470.0" y2="380.0" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="565.8" y1="445.2" x2="581.2" y2="397.6" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="652.2" y1="489.2" x2="681.6" y2="448.8" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="720.8" y1="557.8" x2="761.2" y2="528.4" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="764.8" y1="644.2" x2="812.4" y2="628.8" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="780.0" y1="740.0" x2="830.0" y2="740.0" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="764.8" y1="835.8" x2="812.4" y2="851.2" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="720.8" y1="922.2" x2="761.2" y2="951.6" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="652.2" y1="990.8" x2="681.6" y2="1031.2" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="565.8" y1="1034.8" x2="581.2" y2="1082.4" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="470.0" y1="1050.0" x2="470.0" y2="1100.0" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="374.2" y1="1034.8" x2="358.8" y2="1082.4" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--white)" x1="287.8" y1="990.8" x2="258.4" y2="1031.2" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--yellow)" x1="227.3" y1="916.3" x2="170.7" y2="957.5" stroke-width="22" stroke-linecap="round"/>
      <line style="stroke:var(--blue)" x1="175.2" y1="835.8" x2="127.6" y2="851.2" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--blue)" x1="160.0" y1="740.0" x2="110.0" y2="740.0" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--blue)" x1="175.2" y1="644.2" x2="127.6" y2="628.8" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--blue)" x1="219.2" y1="557.8" x2="178.8" y2="528.4" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--blue)" x1="287.8" y1="489.2" x2="258.4" y2="448.8" stroke-width="18" stroke-linecap="round"/>
      <line style="stroke:var(--blue)" x1="374.2" y1="445.2" x2="358.8" y2="397.6" stroke-width="18" stroke-linecap="round"/>
    </g>
  </svg>
  <div class="abs step">الخطوة الثالثة</div>
  <div class="abs head">خلّي عيونك<br>ترتاح</div>
  <div class="abs center"><span class="n num">20</span><span class="u">ثانية</span><span class="least"><span class="brush full">على الأقل</span></span></div>
  <div class="abs note">عدّ لـ<span class="num">20</span> بهدوء وإنت تباوع لبعيد، و<b>رمّش على راحتك</b>.</div>
  <div class="sig" style="right: var(--margin); color: var(--white);"><span class="dot" style="background:var(--yellow)"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--blue);">05 / 08</div>
</div><script src="shaping.js"></script></body></html>
