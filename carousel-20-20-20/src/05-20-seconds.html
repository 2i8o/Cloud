<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--white); }
  .step { top: 112px; right: var(--margin); color: var(--navy); font-size: 40px; font-weight: 500; }
  .head { top: 186px; right: var(--margin); color: var(--navy); font-size: 96px; font-weight: 700; line-height: 1.2; }
  .center { left: 270px; width: 400px; top: 586px; text-align: center; }
  .center .n { color: var(--navy); font-size: 220px; font-weight: 600; line-height: 1; letter-spacing: -5px; }
  .center .u { color: var(--navy); font-size: 52px; font-weight: 500; display: block; margin-top: -4px; }
  .least { display: inline-block; margin-top: 10px; color: var(--navy); font-size: 42px; font-weight: 700; line-height: 1.3; }
  .note { top: 1148px; right: var(--margin); width: 904px; color: var(--navy); font-size: 44px; font-weight: 500; line-height: 1.6; }
  .note b { font-weight: 700; }
</style></head>
<body><div class="slide">

      <line style="stroke:var(--navy)" x1="470.0" y1="1056.0" x2="470.0" y2="1102.0" stroke-width="12" stroke-linecap="round"/>
      <line style="stroke:var(--navy)" x1="377.3" y1="1041.3" x2="363.1" y2="1085.1" stroke-width="12" stroke-linecap="round"/>

  <div class="abs step">الخطوة الثالثة</div>
  <div class="abs head">خلّي عيونك<br>ترتاح</div>
  <div class="abs center"><span class="n num">20</span><span class="u">ثانية</span><span class="least"><span class="brush">على الأقل</span></span></div>
  <div class="abs note">عدّ لـ<span class="num">20</span> بهدوء وإنت تباوع لبعيد، و<b>رمّش على راحتك</b>.</div>
  <div class="sig" style="right: var(--margin); color: var(--navy);"><span class="dot" style="background:var(--yellow)"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--navy);">05 / 08</div>
</div><script src="shaping.js"></script></body></html>
