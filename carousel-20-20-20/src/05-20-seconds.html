  .center .u { color: var(--blue); font-size: 56px; font-weight: 600; display: block; margin-top: -6px; }

  .note b { color: var(--blue); font-weight: 700; }
  .least { top: 640px; right: var(--margin); color: var(--blue); font-size: 40px; font-weight: 600; line-height: 1.4; text-align: right; }
</style></head>
