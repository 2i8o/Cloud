<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--blue); }
  .kicker { top: 104px; right: var(--margin); color: var(--navy); font-size: 40px; font-weight: 600; }
  .kicker::before { content: ""; display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: var(--white); margin-left: 18px; vertical-align: middle; }
  .head { top: 168px; right: var(--margin); color: var(--navy); font-size: 128px; font-weight: 700; line-height: 1.12; }
  .rule { top: 500px; left: var(--margin); color: var(--white); text-align: left; direction: rtl; }
  .rule .lbl { font-size: 40px; font-weight: 600; display: block; color: var(--navy); }
  .rule .n { font-size: 112px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
  .person { bottom: 0; left: 50%; width: 570px; height: 684px; transform: translateX(-55%); }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- iris planes: layered solids, cropped by the canvas -->
    <circle style="fill:var(--navy)" cx="510" cy="1290" r="560"/>
    <circle style="stroke:var(--white)" cx="510" cy="1290" r="640" fill="none" stroke-opacity=".28" stroke-width="3"/>
    <circle style="stroke:var(--white)" cx="510" cy="1290" r="720" fill="none" stroke-opacity=".14" stroke-width="3"/>
    <circle style="stroke:var(--blue)" cx="510" cy="1290" r="440" fill="none" stroke-opacity=".35" stroke-width="2"/>
  </svg>
  <div class="abs kicker">طلاب السادس وجماعة الموبايل</div>
  <div class="abs head">عيونك تحتاج<br><span class="brush">استراحة!</span></div>
  <div class="abs rule"><span class="lbl">قاعدة</span><span class="n num">20-20-20</span></div>
  <svg class="abs person" viewBox="0 0 600 720" aria-hidden="true">
  <!-- Flat-vector stand-in for the presenter. Replace with the approved cut-out photo of Abbas. -->
  <!-- shirt -->
  <path style="fill:var(--white)" d="M20 720 C24 590 96 528 214 500 L386 500 C504 528 576 590 580 720 Z"/>
  <path style="stroke:var(--navy)" d="M150 720 C156 650 162 600 176 560" stroke-opacity=".10" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path style="stroke:var(--navy)" d="M450 720 C444 650 438 600 424 560" stroke-opacity=".10" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- neck -->

  <path style="fill:var(--skin-shade)" d="M252 430 C280 456 320 456 348 430 L348 470 C320 490 280 490 252 470 Z"/>

  <path style="fill:var(--white);stroke:var(--navy)" d="M364 494 L300 584 L338 612 L392 516 Z" stroke-opacity=".18" stroke-width="3" stroke-linejoin="round"/>
  <line style="stroke:var(--navy)" x1="300" y1="590" x2="300" y2="720" stroke-opacity=".12" stroke-width="3"/>
  <circle style="fill:var(--navy)" cx="300" cy="640" r="5" fill-opacity=".22"/>
  <circle style="fill:var(--navy)" cx="300" cy="694" r="5" fill-opacity=".22"/>

  <path style="stroke:var(--blue)" d="M176 292 C164 196 214 118 302 116 C394 114 442 186 424 292 C424 384 372 452 300 452 C228 452 176 384 176 292 Z" fill="none" stroke-width="10"/>

  <ellipse style="stroke:var(--blue)" cx="420" cy="300" rx="24" ry="38" fill="none" stroke-width="10"/>
  <!-- ears -->
  <ellipse style="fill:var(--skin-shade)" cx="180" cy="300" rx="24" ry="38"/>
  <ellipse style="fill:var(--skin-shade)" cx="420" cy="300" rx="24" ry="38"/>
  <!-- head -->
  <path style="fill:var(--skin)" d="M300 140 C384 140 424 206 424 290 C424 384 372 452 300 452 C228 452 176 384 176 290 C176 206 216 140 300 140 Z"/>

  <path style="fill:var(--navy)" d="M184 318 C188 404 238 452 300 452 C362 452 412 404 416 318 C404 352 392 372 372 384 C352 372 330 366 300 366 C270 366 248 372 228 384 C208 372 196 352 184 318 Z"/>

  <path style="fill:var(--navy)" d="M176 292 C164 196 214 118 302 116 C394 114 442 186 424 292 C414 250 404 222 388 206 C350 222 268 224 214 200 C198 222 186 252 176 292 Z"/>

  <path style="stroke:var(--navy)" d="M226 252 C244 240 266 240 282 248" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path style="stroke:var(--navy)" d="M318 248 C334 240 356 240 374 252" stroke-width="11" stroke-linecap="round" fill="none"/>

  <ellipse style="fill:var(--white)" cx="254" cy="290" rx="20" ry="13"/>
  <ellipse style="fill:var(--white)" cx="346" cy="290" rx="20" ry="13"/>
  <circle style="fill:var(--navy)" cx="256" cy="291" r="10"/>
  <circle style="fill:var(--navy)" cx="344" cy="291" r="10"/>
  <circle style="fill:var(--white)" cx="259" cy="287" r="3"/>
  <circle style="fill:var(--white)" cx="347" cy="287" r="3"/>
  <!-- nose -->
  <path style="stroke:var(--skin-shade)" d="M300 300 C296 324 288 340 290 350 C296 356 306 356 312 352" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- smile -->
  <path style="stroke:var(--white)" d="M276 390 C290 398 310 398 324 390" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
  <div class="sig" style="right: var(--margin); color: var(--white);"><span class="dot" style="background:var(--yellow)"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--navy);">01 / 08</div>
</div><script src="shaping.js"></script></body></html>
