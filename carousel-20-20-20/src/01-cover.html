<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--blue); }
  .kicker { top: 104px; right: var(--margin); color: var(--navy); font-size: 42px; font-weight: 600; }
  .kicker::before { content: ""; display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: var(--white); margin-left: 18px; vertical-align: middle; }
  .head { top: 172px; right: var(--margin); color: var(--navy); font-size: 132px; font-weight: 700; line-height: 1.12; }
  .rule { top: 520px; left: var(--margin); text-align: left; }
  .rule .lbl { font-size: 44px; font-weight: 600; display: block; color: var(--navy); }
  .rule .n { font-size: 120px; font-weight: 700; line-height: 1; letter-spacing: -2px; color: var(--white); }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- Concept cover: an eye whose iris carries the 20-minute sector (links to slide 03) -->
    <defs>
      <clipPath id="eye"><path d="M30 1030 Q540 690 1050 1030 Q540 1370 30 1030 Z"/></clipPath>
    </defs>
    <path style="fill:var(--white)" d="M30 1030 Q540 690 1050 1030 Q540 1370 30 1030 Z"/>
    <g clip-path="url(#eye)">
      <circle style="fill:var(--navy)" cx="540" cy="1030" r="200"/>
      <path style="fill:var(--yellow)" d="M540 1030 L540 860 A170 170 0 0 1 687.2 1115 Z"/>
      <circle style="fill:var(--navy)" cx="540" cy="1030" r="78"/>
      <circle style="fill:var(--white)" cx="574" cy="996" r="20"/>
    </g>
    <!-- lids: upper lid heavier, lashes follow the curve -->
    <path style="stroke:var(--navy)" d="M30 1030 Q540 690 1050 1030" fill="none" stroke-width="16" stroke-linecap="round"/>
    <path style="stroke:var(--navy)" d="M1050 1030 Q540 1370 30 1030" fill="none" stroke-width="8" stroke-linecap="round"/>
    <g style="stroke:var(--navy)" stroke-width="12" stroke-linecap="round">
      <line x1="196" y1="928" x2="160" y2="880"/>
      <line x1="318" y1="887" x2="296" y2="830"/>
      <line x1="446" y1="866" x2="438" y2="806"/>
      <line x1="634" y1="866" x2="642" y2="806"/>
      <line x1="762" y1="887" x2="784" y2="830"/>
      <line x1="884" y1="928" x2="920" y2="880"/>
    </g>
  </svg>
  <div class="abs kicker">طلاب السادس وجماعة الموبايل</div>
  <div class="abs head">عيونك تحتاج<br><span class="brush">استراحة!</span></div>
  <div class="abs rule"><span class="lbl">قاعدة</span><span class="n num">20-20-20</span></div>
  <div class="sig" style="right: var(--margin); color: var(--navy);"><span class="dot" style="background:var(--yellow)"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--navy);">01 / 08</div>
</div><script src="shaping.js"></script></body></html>
