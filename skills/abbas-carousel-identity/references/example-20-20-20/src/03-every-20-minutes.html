<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--blue); }
  .step { top: 120px; right: var(--margin); color: var(--navy); font-size: 40px; font-weight: 500; }
  .head { top: 172px; right: var(--margin); color: var(--navy); font-size: 112px; font-weight: 700; line-height: 1.15; }
  .two { top: 280px; left: 40px; color: var(--navy); font-size: 700px; font-weight: 700; line-height: 1; direction: ltr; letter-spacing: -20px; }
  .note { top: 1030px; right: var(--margin); width: 904px; color: var(--navy); font-size: 46px; font-weight: 500; line-height: 1.6; }
  .note b { font-weight: 700; }
</style></head>
<body><div class="slide">
  <div class="abs two">2</div>
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- the "0" of 20 is a clock: 12 → 4 = twenty minutes -->
    <g transform="translate(724 680)">
      <!-- solid offset plane gives depth without transparency -->
      <circle style="fill:var(--navy)" cx="16" cy="18" r="250"/>
      <circle style="fill:var(--white)" r="250"/>
      <path style="fill:var(--yellow)" d="M0 0 L0 -228 A228 228 0 0 1 197.45 114 Z"/>
      <g style="stroke:var(--navy)" stroke-linecap="round">
        <line x1="0" y1="-236" x2="0" y2="-206" stroke-width="8"/>
        <line x1="0" y1="236" x2="0" y2="206" stroke-width="8"/>
        <line x1="236" y1="0" x2="206" y2="0" stroke-width="8"/>
        <line x1="-236" y1="0" x2="-206" y2="0" stroke-width="8"/>
        <g stroke-width="4">
          <line x1="118" y1="-204.4" x2="106" y2="-183.6"/>
          <line x1="204.4" y1="-118" x2="183.6" y2="-106"/>
          <line x1="204.4" y1="118" x2="183.6" y2="106"/>
          <line x1="118" y1="204.4" x2="106" y2="183.6"/>
          <line x1="-118" y1="204.4" x2="-106" y2="183.6"/>
          <line x1="-204.4" y1="118" x2="-183.6" y2="106"/>
          <line x1="-204.4" y1="-118" x2="-183.6" y2="-106"/>
          <line x1="-118" y1="-204.4" x2="-106" y2="-183.6"/>
        </g>
        <!-- minute hand at 4 (= 20 min), hour hand short -->
        <line x1="0" y1="0" x2="160" y2="92" stroke-width="12"/>
        <line x1="0" y1="0" x2="-88" y2="-74" stroke-width="15"/>
      </g>
      <circle style="fill:var(--navy)" r="18"/>
      <circle style="fill:var(--white)" r="7"/>
    </g>
  </svg>
  <div class="abs step">الخطوة الأولى</div>
  <div class="abs head">كل <span class="num">20</span> دقيقة</div>
  <div class="abs note">شغّل منبّه بالموبايل،<br>لأن <b class="brush">محّد يتذكر</b> وهو غاطس بالدراسة أو بالريلز.</div>
  <div class="sig" style="right: var(--margin); color: var(--navy);"><span class="dot" style="background:var(--white)"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--navy);">03 / 08</div>
</div><script src="shaping.js"></script></body></html>
