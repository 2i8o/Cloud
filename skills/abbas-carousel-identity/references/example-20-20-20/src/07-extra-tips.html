<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide { background: var(--blue); }
  .kick { top: 120px; right: var(--margin); color: var(--navy); font-size: 40px; font-weight: 500; }
  .head { top: 172px; right: var(--margin); color: var(--navy); font-size: 100px; font-weight: 700; line-height: 1.2; }
  .tip .t { display: block; color: var(--navy); font-size: 54px; font-weight: 600; line-height: 1.25; }
  .tip .d { display: block; color: var(--navy); font-size: 42px; font-weight: 500; line-height: 1.5; margin-top: 4px; }
</style></head>
<body><div class="slide">
  <svg class="layer" viewBox="0 0 1080 1350">
    <!-- a closed eye: the blink / rest that the tips protect (echoes the cover eye) -->
    <g transform="translate(176 470)" style="stroke:var(--white)" fill="none" stroke-linecap="round">
      <path d="M-150 -20 Q0 100 150 -20" stroke-width="12"/>
      <line x1="-108" y1="30" x2="-136" y2="78" stroke-width="9"/>
      <line x1="-40" y1="52" x2="-50" y2="108" stroke-width="9"/>
      <line x1="40" y1="52" x2="50" y2="108" stroke-width="9"/>
      <line x1="108" y1="30" x2="136" y2="78" stroke-width="9"/>
    </g>
  </svg>
  <div class="abs kick">مو بس <span class="num">20-20-20</span></div>
  <div class="abs head">وحتى تكمل الراحة</div>

  <div class="abs tip" style="top: 400px; right: var(--margin);"><span class="t">لا تنسى ترمش</span><span class="d">الرمش يرطّب العين ويقلّل الجفاف.</span></div>
  <div class="abs tip" style="top: 590px; right: 176px;"><span class="t">إضاءة الشاشة</span><span class="d">ابعد اللمعة والانعكاس عنها.</span></div>
  <div class="abs tip" style="top: 780px; right: var(--margin);"><span class="t">المسافة</span><span class="d">لا تلزّگ الموبايل بوجهك.</span></div>
  <div class="abs tip last" style="top: 970px; right: 176px;"><span class="t"><span class="brush">الأعراض مستمرة؟</span></span><span class="d">راجع أخصائي بصريات وافحص نظرك.</span></div>

  <div class="sig" style="right: var(--margin); color: var(--navy);"><span class="dot" style="background:var(--yellow)"></span>عباس عبدالمنعم</div>
  <div class="pager" style="left: var(--margin); color: var(--navy);">07 / 08</div>
</div><script src="shaping.js"></script></body></html>
